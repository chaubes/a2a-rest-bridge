[project]
name = "agentcart-mcp-servers"
version = "0.1.0"
description = "FastMCP tool servers that wrap the AgentCart REST APIs with guardrails, audit logging, and tracing."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=2.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-httpx>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
inventory-mcp = "inventory_mcp.server:main"
payment-mcp = "payment_mcp.server:main"
shipping-mcp = "shipping_mcp.server:main"
order-mcp = "order_mcp.server:main"
notification-mcp = "notification_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "shared",
    "inventory_mcp",
    "payment_mcp",
    "shipping_mcp",
    "order_mcp",
    "notification_mcp",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
