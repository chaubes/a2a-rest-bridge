[project]
name = "agentcart-agents"
version = "0.1.0"
description = "AgentCart A2A agent layer: five LangGraph agents that orchestrate an order workflow over the A2A protocol and bridge to the MCP tool servers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.0.3,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-mcp-adapters>=0.2.0,<0.3.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-ollama>=1.0.0,<2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "uvicorn>=0.48.0",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
order-agent = "order_agent.server:main"
inventory-agent = "inventory_agent.server:main"
payment-agent = "payment_agent.server:main"
shipping-agent = "shipping_agent.server:main"
notification-agent = "notification_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "shared",
    "order_agent",
    "inventory_agent",
    "payment_agent",
    "shipping_agent",
    "notification_agent",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
